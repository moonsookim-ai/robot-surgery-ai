<!--
title: Request a demo
description: Book a hands-on demonstration of the Lumenara Arc robotic surgical system.
eyebrow: Get started
heading: See Lumenara Arc in your operating room.
lead: Book a hands-on demonstration with our clinical specialists. We will tailor the session to your specialties, case mix and program goals.
image: media/hero-poster.jpg
position: 55% 50%
-->
    <section class="section demo">
          <div class="container demo__grid">
            <div class="reveal">
              <h2 class="h-sub">What to expect</h2>
              <p class="section__lead">A Lumenara clinical specialist will contact you within one business day to plan a session at your hospital or at one of our training centers.</p>
              <ul class="ticks ticks--lg">
                <li>Console test-drive with your surgeons</li>
                <li>Program &amp; ROI planning for your hospital</li>
                <li>Training pathway for your whole team</li>
              </ul>
            </div>
            <form class="form reveal" id="demo-form" novalidate>
              <div class="form__row">
                <label>First name<input name="first" autocomplete="given-name" required></label>
                <label>Last name<input name="last" autocomplete="family-name" required></label>
              </div>
              <label>Work email<input type="email" name="email" autocomplete="email" required></label>
              <label>Hospital / institution<input name="org" autocomplete="organization" required></label>
              <div class="form__row">
                <label>Role
                  <select name="role" required>
                    <option value="">Select…</option>
                    <option>Surgeon</option><option>OR / Perioperative lead</option><option>Hospital executive</option><option>Procurement</option><option>Other</option>
                  </select>
                </label>
                <label>Specialty
                  <select name="specialty">
                    <option value="">Select…</option>
                    <option>General &amp; Colorectal</option><option>Urology</option><option>Gynecology</option><option>Thoracic</option><option>Micro &amp; Reconstructive</option>
                  </select>
                </label>
              </div>
              <label>Message <span class="opt">(optional)</span><textarea name="msg" rows="3"></textarea></label>
              <button class="btn btn--primary btn--block" type="submit">Request a demo</button>
              <p class="form__note" role="status" aria-live="polite"></p>
            </form>
          </div>
        </section>
